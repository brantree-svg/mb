<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MB 브랜드몰 분리 구축 · 진행 보고</title>
<style>
html,body{margin:0;height:100%;background:#1a1917;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#deck{height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}#deck::-webkit-scrollbar{display:none}
.sl{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
.cv{width:1920px;height:1080px;position:relative;transform:scale(var(--k));transform-origin:center;flex:none;background:#F2F0E9}
.cv img{width:1920px;height:1080px;display:block}.lk{position:absolute;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:5}#bar{height:100%;background:#F2F0E9;width:0;transition:width .2s}
#pg{position:fixed;right:14px;top:12px;color:#F2F0E9;font-size:12px;opacity:.8;z-index:5}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:22px;cursor:pointer;z-index:5;border-radius:6px}#prev{left:8px}#next{right:8px}
#fs{position:fixed;left:12px;top:10px;z-index:5;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;font-size:12px;padding:5px 9px;border-radius:5px;cursor:pointer}
#intro{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-align:center;line-height:1.7}
#intro div{background:#2a2825;padding:28px 32px;border-radius:10px;max-width:320px}#intro button{margin:8px 4px 0;padding:8px 14px;border:0;border-radius:6px;background:#F2F0E9;color:#111;font-weight:600;cursor:pointer}
#rot{display:none;font-size:12px;opacity:.7;margin-top:8px}@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
</style></head><body>
<div id="intro"><div><b>MB 브랜드몰 분리 구축 · 진행 보고</b><br>좌우 버튼 · 방향키 · 스와이프로 넘김<br><small>내부 보고용 · 외부 공유 자제</small><div id="rot">아이폰은 가로 회전 권장</div><br><button onclick="go(1)">전체화면으로 보기</button><button onclick="go(0)">이대로 보기</button></div></div>
<button id="fs" onclick="tf()">⛶ 크게 보기</button><div id="pg">01 / 06</div><button class="nav" id="prev" onclick="step(-1)">‹</button><button class="nav" id="next" onclick="step(1)">›</button>
<div id="deck"><section class="sl"><div class="cv"><img src="s1.jpg" alt="slide 1" ></div></section><section class="sl"><div class="cv"><img src="s2.jpg" alt="slide 2" ></div></section><section class="sl"><div class="cv"><img src="s3.jpg" alt="slide 3" loading=lazy></div></section><section class="sl"><div class="cv"><img src="s4.jpg" alt="slide 4" loading=lazy></div></section><section class="sl"><div class="cv"><img src="s5.jpg" alt="slide 5" loading=lazy><a class="lk" href="https://brantree-svg.github.io/mb/index.html" target="_blank" rel="noopener" style="left:60.0px;top:860.0px;width:500.0px;height:44.0px"></a></div></section><section class="sl"><div class="cv"><img src="s6.jpg" alt="slide 6" loading=lazy><a class="lk" href="https://brantree-svg.github.io/mb/v1.html" target="_blank" rel="noopener" style="left:60.0px;top:560.0px;width:500.0px;height:28.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v2.html" target="_blank" rel="noopener" style="left:60.0px;top:656.0px;width:500.0px;height:28.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v3.html" target="_blank" rel="noopener" style="left:60.0px;top:752.0px;width:500.0px;height:28.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/d.html" target="_blank" rel="noopener" style="left:60.0px;top:848.0px;width:500.0px;height:28.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/index.html" target="_blank" rel="noopener" style="left:700.0px;top:1018.0px;width:700.0px;height:18.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v1.html" target="_blank" rel="noopener" style="left:600.0px;top:156.0px;width:610.0px;height:280.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v1.html" target="_blank" rel="noopener" style="left:600.0px;top:448.0px;width:610.0px;height:26.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v2.html" target="_blank" rel="noopener" style="left:1250.0px;top:156.0px;width:610.0px;height:280.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v2.html" target="_blank" rel="noopener" style="left:1250.0px;top:448.0px;width:610.0px;height:26.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v3.html" target="_blank" rel="noopener" style="left:600.0px;top:500.0px;width:610.0px;height:280.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/v3.html" target="_blank" rel="noopener" style="left:600.0px;top:792.0px;width:610.0px;height:26.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/d.html" target="_blank" rel="noopener" style="left:1250.0px;top:500.0px;width:610.0px;height:280.0px"></a><a class="lk" href="https://brantree-svg.github.io/mb/d.html" target="_blank" rel="noopener" style="left:1250.0px;top:792.0px;width:610.0px;height:26.0px"></a></div></section></div><div id="ui"><div id="bar"></div></div>
<script>
const deck=document.getElementById('deck'),N=6;let t;
function fit(){document.documentElement.style.setProperty('--k',Math.min(innerWidth/1920,innerHeight/1080))}
function cur(){return Math.round(deck.scrollTop/deck.clientHeight)}
function upd(){const c=cur();document.getElementById('pg').textContent=String(c+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');document.getElementById('bar').style.width=((c+1)/N*100)+'%';history.replaceState(null,'','#'+(c+1))}
function to(i){i=Math.max(0,Math.min(N-1,i));deck.scrollTo({top:i*deck.clientHeight,behavior:'smooth'})}
function step(d){to(cur()+d)}
function tf(){const b=document.getElementById('fs');if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();b.textContent='원래대로'}else{document.exitFullscreen();b.textContent='⛶ 크게 보기'}}
function go(f){document.getElementById('intro').remove();if(f)tf()}
addEventListener('resize',()=>{fit();to(cur())});deck.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(upd,80)});
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}});
fit();const h=parseInt(location.hash.slice(1));if(h>0)setTimeout(()=>deck.scrollTo(0,(h-1)*deck.clientHeight),50);upd();
</script></body></html>
