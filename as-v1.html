<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBH GLOBAL A/S 와이어프레임 v5 — POP 마인드브릿지 기준</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--ink:#15140f;--mut:#8a8780;--line:#ece9e3;--ph:#eeebe5;--cream:#f7f5f1;--pht:#b6b2a8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:"Pretendard",sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.5;letter-spacing:-0.01em;}
  .tabs{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 28px;height:54px;overflow-x:auto;}
  .tabs .brand{font-weight:700;letter-spacing:0.08em;margin-right:22px;font-size:12px;white-space:nowrap;color:var(--mut);}
  .tabs button{border:0;background:none;font-family:inherit;font-size:12.5px;color:var(--mut);padding:16px 12px;cursor:pointer;white-space:nowrap;letter-spacing:0.02em;border-bottom:1px solid transparent;margin-bottom:-1px;}
  .tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
  .tabs .util{margin-left:auto;border:1px solid var(--line)!important;border-radius:20px;padding:7px 14px;font-size:11.5px;color:var(--mut);margin-bottom:0;}
  .tabs .util.on{color:var(--ink);border-color:var(--ink)!important;}
  main{max-width:1060px;margin:0 auto;padding:0 30px 120px;}
  main.split{max-width:1440px;}
  .head{padding:34px 0 6px;display:flex;align-items:baseline;gap:14px;}
  .head h1{font-size:20px;font-weight:600;letter-spacing:-0.025em;}
  .head .url{font-size:12px;color:var(--pht);margin-left:auto;}
  .lede{font-size:12.5px;color:var(--mut);line-height:1.7;padding:0 0 18px;border-bottom:1px solid var(--line);}
  .gnb{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);}
  .gnb .lg{font-weight:700;letter-spacing:0.08em;font-size:12px;color:var(--mut);}
  .gnb .mn{display:flex;gap:14px;font-size:11px;color:var(--pht);letter-spacing:0.03em;flex-wrap:wrap;}
  .gnb .ut{margin-left:auto;font-size:11px;color:var(--pht);letter-spacing:0.05em;}
  section{padding:28px 0;border-bottom:1px solid var(--line);}
  .sl{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .sl .i{font-size:11px;color:var(--pht);font-weight:600;min-width:20px;}
  .sl .t{font-size:14px;font-weight:600;letter-spacing:-0.02em;}
  .sl .n{margin-left:auto;font-size:11px;color:var(--pht);letter-spacing:0.02em;}
  .sl .n.mod{color:var(--ink);}
  .iml{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--pht);letter-spacing:0.02em;line-height:1.3;}
  .iml .ico{display:inline-flex;}
  .iml .ico svg{display:block;}
  .g{display:grid;gap:10px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .tile{background:var(--ph);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11.5px;text-align:center;padding:10px;}
  .card .im{background:var(--ph);border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .card .c{padding:9px 2px 0;font-size:11px;color:var(--pht);}
  .card .c b{display:block;color:var(--ink);font-weight:500;font-size:12px;margin-bottom:2px;letter-spacing:-0.01em;}
  .hero{position:relative;border-radius:16px;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
  .hero .svc{font-size:11px;color:var(--pht);letter-spacing:0.14em;margin-bottom:14px;}
  .hero .cap{font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.35;}
  .hero .sub{font-size:12.5px;color:var(--mut);line-height:1.8;margin-top:12px;}
  .hero .btns{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center;}
  .hero .btns div{font-size:12px;padding:11px 28px;border-radius:12px;border:1px solid var(--line);color:var(--mut);}
  .hero .btns .p{background:var(--ink);color:#fff;border-color:var(--ink);}
  .hero .imgn{position:absolute;top:14px;left:16px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:11.5px;color:var(--mut);border:1px solid var(--line);padding:8px 14px;letter-spacing:0.02em;border-radius:20px;background:#fff;}
  .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .flow .st{flex:1;min-width:80px;background:var(--ph);border-radius:14px;padding:15px 6px;text-align:center;font-size:11.5px;color:var(--mut);}
  .flow .st small{color:var(--pht);}
  .flow .ar{color:var(--pht);font-size:11px;}
  .note{margin-top:12px;padding:13px 15px;border-radius:14px;font-size:11.5px;line-height:1.8;background:var(--cream);border:1px solid var(--line);color:var(--mut);}
  .note b{color:var(--ink);font-weight:500;}
  .gap{margin-top:0;padding:26px 18px;border-radius:16px;font-size:11.5px;line-height:1.8;border:1px dashed var(--pht);color:var(--pht);text-align:center;}
  .devnote{display:none;margin:0 0 12px;padding:9px 13px;background:var(--cream);border:1px solid var(--line);border-left:2px solid var(--mut);border-radius:8px;font-size:11.5px;color:var(--mut);line-height:1.6;}
  .devnote b{color:var(--ink);font-weight:500;}
  .dtag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:0.06em;color:var(--pht);margin-right:8px;}
  body.showdev .devnote{display:block;}
  .foot{padding:26px 0;font-size:10.5px;color:var(--pht);letter-spacing:0.03em;}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;}
  .cmp .col{min-width:0;}
  .colhd{position:sticky;top:54px;z-index:5;background:#fff;padding:16px 0 11px;border-bottom:1px solid var(--ink);margin-bottom:2px;}
  .colhd .lb{font-size:13px;font-weight:600;letter-spacing:-0.02em;}
  .colhd .ds{font-size:11px;color:var(--pht);margin-top:3px;}
  .cmp section{padding:20px 0;}
  .cmp .hero{padding:32px 16px;}
  .cmp .hero .cap{font-size:19px;}
  .cmp .flow .st{min-width:52px;font-size:10px;padding:10px 3px;}
  .cmp .g4{grid-template-columns:repeat(2,1fr);}
  .popwrap{display:flex;justify-content:center;padding:4px 0 0;}
  .pop{width:100%;max-width:430px;aspect-ratio:210/297;background:#fff;border:1px solid var(--line);border-radius:4px;padding:38px 34px 30px;display:flex;flex-direction:column;text-align:center;}
  .pop .brow{display:flex;justify-content:center;padding-bottom:16px;border-bottom:1px solid var(--ink);}
  .pop .brow .mb{font-size:12px;letter-spacing:0.22em;font-weight:600;color:var(--ink);}
  .pop .svc{font-size:9.5px;letter-spacing:0.16em;color:var(--mut);margin-top:30px;}
  .pop .cap{font-size:26px;font-weight:600;letter-spacing:-0.035em;line-height:1.4;margin-top:16px;}
  .pop .sub{font-size:11.5px;color:var(--mut);line-height:1.9;margin-top:16px;}
  .pop .ln{width:26px;height:1px;background:var(--pht);margin:26px auto;}
  .pop .lst{font-size:10.5px;color:var(--mut);line-height:2.1;text-align:left;max-width:250px;margin:0 auto;}
  .pop .qrbox{margin-top:auto;padding-top:24px;}
  .pop .qrbox img{width:92px;height:92px;display:block;margin:0 auto 9px;}
  .pop .qrbox .u{font-size:10px;color:var(--mut);letter-spacing:0.02em;}
  .pop .lg{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);}
  .pop .lg .sv{font-size:8.5px;letter-spacing:0.14em;color:var(--pht);}
  .mt{display:flex;align-items:baseline;gap:8px;font-size:10.5px;color:var(--pht);padding:9px 0;border-bottom:1px dotted var(--line);}
  .mt b{color:var(--ink);font-weight:500;min-width:60px;}
  .mtbox{margin-top:14px;}
  @media(max-width:900px){.cmp{grid-template-columns:1fr;}.colhd{position:static;}}
  @media(max-width:760px){
    main{padding:0 18px 80px;}
    .g4{grid-template-columns:repeat(2,1fr);}
    .hero .cap{font-size:20px;}
    .flow .st{min-width:58px;font-size:10.5px;padding:11px 4px;}
  }
</style>
</head>
