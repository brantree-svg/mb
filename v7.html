<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB 브랜드몰 리뉴얼 와이어프레임 (v7 · 클릭 랜딩 샘플)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--ink:#15140f;--mut:#8a8780;--line:#ece9e3;--ph:#e9e6df;--cream:#f6f4ef;--pht:#b6b2a8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:"Pretendard",sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.5;letter-spacing:-0.01em;}
  .tabs{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 28px;height:54px;overflow-x:auto;}
  .tabs .brand{font-weight:800;letter-spacing:0.08em;margin-right:22px;font-size:13px;white-space:nowrap;}
  .tabs button{border:0;background:none;font-family:inherit;font-size:12.5px;color:var(--mut);padding:16px 12px;cursor:pointer;white-space:nowrap;letter-spacing:0.02em;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
  .tabs .util{margin-left:10px;border:1px solid var(--line)!important;border-radius:20px;padding:7px 14px;font-size:11.5px;color:var(--mut);margin-bottom:0;}
  .tabs .util.on{color:var(--ink);border-color:var(--ink)!important;}
  main{max-width:1060px;margin:0 auto;padding:0 30px 120px;}
  .anim{opacity:0;transform:translateY(12px);animation:up .6s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes up{to{opacity:1;transform:none;}}
  .head{padding:34px 0 6px;display:flex;align-items:baseline;gap:14px;}
  .head h1{font-size:22px;font-weight:700;letter-spacing:-0.025em;}
  .head .url{font-size:12px;color:var(--mut);margin-left:auto;}
  .lede{font-size:13px;color:var(--mut);line-height:1.7;padding:0 0 18px;border-bottom:1px solid var(--line);}
  .gnb{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);}
  .gnb .lg{font-weight:800;letter-spacing:0.08em;font-size:13px;}
  .gnb .mn{display:flex;gap:14px;font-size:11px;color:var(--mut);letter-spacing:0.03em;flex-wrap:wrap;}
  .gnb .mn .a{color:var(--ink);font-weight:600;}
  .gnb .ut{margin-left:auto;font-size:11px;color:var(--pht);letter-spacing:0.05em;}
  section{padding:30px 0;border-bottom:1px solid var(--line);}
  .sl{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
  .sl .i{font-size:11px;color:var(--pht);font-weight:600;min-width:22px;}
  .sl .t{font-size:15px;font-weight:700;letter-spacing:-0.02em;}
  .sl .n{margin-left:auto;font-size:10px;color:#fff;background:var(--pht);border-radius:5px;padding:3px 8px;letter-spacing:0.05em;font-weight:700;}
  .ph{background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--pht);font-size:11px;text-align:center;border-radius:16px;overflow:hidden;}
  .hero{position:relative;border-radius:20px;}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.22));border-radius:20px;}
  .hero .kick{position:absolute;top:18px;left:20px;z-index:2;font-size:11px;color:#fff;background:rgba(21,20,15,.5);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:20px;letter-spacing:0.05em;}
  .hero .cap{position:absolute;left:22px;bottom:22px;z-index:2;font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.02em;text-shadow:0 1px 3px rgba(0,0,0,.35);max-width:80%;}
  .g{display:grid;gap:10px;}
  .g2{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g4{grid-template-columns:repeat(4,1fr);}.g5{grid-template-columns:repeat(5,1fr);}
  .tile{position:relative;background:var(--ph);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b6760;font-size:15px;font-weight:700;text-align:center;padding:10px;}
  .tile small{display:block;margin-top:7px;font-weight:400;font-size:10.5px;color:var(--pht);}
  .tile.sm{font-size:12.5px;font-weight:500;}
  .subnav{display:flex;flex-direction:column;gap:10px;}
  .snrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .snl{font-size:10.5px;font-weight:700;color:var(--pht);letter-spacing:0.06em;min-width:58px;}
  .card{background:#fff;}
  .card .im{background:var(--ph);border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .iml{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--pht);letter-spacing:0.02em;line-height:1.3;}
  .iml .ico{display:inline-flex;}
  .iml .ico svg{display:block;}
  .card .c{padding:10px 2px 0;font-size:11px;color:var(--mut);}
  .card .c b{display:block;color:var(--ink);font-weight:600;font-size:12px;margin-bottom:2px;letter-spacing:-0.01em;}
  .stmt{text-align:center;font-size:22px;font-weight:700;letter-spacing:-0.03em;padding:38px 0;}
  .lead{font-size:13.5px;color:var(--mut);line-height:1.9;max-width:780px;margin:0 auto;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:11.5px;color:var(--mut);border:1px solid var(--line);padding:8px 14px;letter-spacing:0.02em;border-radius:20px;background:#fff;cursor:pointer;}
  .chip.a{color:var(--ink);border-color:var(--ink);}
  .bar{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--mut);padding:14px 16px;border:1px solid var(--line);border-radius:14px;letter-spacing:0.02em;background:var(--cream);}
  .bar .r{margin-left:auto;}
  table.tl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  table.tl td{border-bottom:1px solid var(--line);padding:13px 14px;font-size:12px;color:var(--mut);line-height:1.6;}
  table.tl tr:last-child td{border-bottom:0;}
  table.tl td.k{font-weight:600;color:var(--ink);width:170px;font-size:12px;}
  table.tl tr.h td{background:var(--cream);font-weight:600;color:var(--ink);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
  .foot{padding:28px 0;font-size:10.5px;color:var(--pht);letter-spacing:0.03em;}
  .pgn{display:flex;justify-content:center;gap:10px;padding-top:22px;font-size:11px;color:var(--mut);}
  .pgn span{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;}
  .pgn span.a{border-color:var(--ink);color:var(--ink);}
  .hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
  .hs::-webkit-scrollbar{height:6px;}
  .hs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .hs::-webkit-scrollbar-track{background:transparent;}
  .hs>.card{flex:0 0 calc((100% - (var(--n) - 1)*14px)/var(--n));scroll-snap-align:start;}
  .fbar{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--mut);padding:14px 16px;border:1px solid var(--line);border-radius:14px;letter-spacing:0.02em;background:var(--cream);}
  .fdrop{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .fd{position:relative;}
  .fdh{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink);font-family:inherit;}
  .fdh .ar{font-size:10px;color:var(--mut);transition:.2s;}
  .fd.open .fdh{border-color:var(--ink);}
  .fd.open .fdh .ar{transform:rotate(180deg);}
  .fdp{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:8;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:210px;box-shadow:0 10px 26px rgba(0,0,0,.09);flex-wrap:wrap;gap:8px;}
  .fd.open .fdp{display:flex;}
  .afilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 16px;}
  .afilter .cnt{font-size:12px;font-weight:700;color:var(--ink);}
  .achips{display:flex;gap:6px;flex-wrap:wrap;}
  .achip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;}
  .achip i{font-style:normal;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mut);font-size:10px;}
  .afilter .clr{margin-left:auto;font-size:11px;color:var(--mut);cursor:pointer;text-decoration:underline;}
  .afilter .none{font-size:11px;color:var(--pht);}
  .filterzone{position:sticky;top:54px;z-index:8;background:#fff;padding:12px 0 8px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tgl{font-size:11.5px;color:var(--mut);border:1px solid var(--line);padding:7px 14px;border-radius:9px;background:#fff;cursor:pointer;user-select:none;transition:.12s;}
  .tgl.a{background:var(--ink);color:#fff;border-color:var(--ink);}
  #app section{scroll-margin-top:70px;}
  .demo{cursor:pointer;transition:transform .15s;}
  .demo:hover{transform:translateY(-2px);}
  .demo .im{position:relative;}
  .dbadge{position:absolute;top:10px;right:10px;z-index:2;font-size:9px;font-weight:700;letter-spacing:.05em;background:#3b6fd4;color:#fff;border-radius:4px;padding:3px 7px;}
  .backbar{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:9px 16px;cursor:pointer;margin:18px 0 4px;background:#fff;}
  .backbar:hover{color:var(--ink);border-color:var(--ink);}
  .devnote{display:none;margin:0 0 12px;padding:9px 13px;background:#eef3fb;border:1px solid #d3e0f5;border-left:3px solid #3b6fd4;border-radius:8px;font-size:11.5px;color:#2f4a7a;line-height:1.6;}
  .devnote b{color:#1f3a6e;}
  .dtag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:0.06em;background:#3b6fd4;color:#fff;border-radius:4px;padding:2px 6px;margin-right:8px;vertical-align:1px;}
  body.showdev .devnote{display:block;}
  .util.dev{color:#3b6fd4;border-color:#3b6fd4!important;animation:devpulse 1.6s ease-out 2;}
  .util.dev.on{background:#3b6fd4;color:#fff;border-color:#3b6fd4!important;animation:none;}
  @keyframes devpulse{0%{box-shadow:0 0 0 0 rgba(59,111,212,.5);}100%{box-shadow:0 0 0 9px rgba(59,111,212,0);}}
  /* M5 CURATION — 착용컷 스토리형 (유일 커스텀 모듈, v4 유지) */
  .pcwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .pc{position:relative;border-radius:16px;overflow:hidden;background:var(--ph);}
  .pc .frames{position:relative;height:400px;}
  .pc .fr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--pht);font-size:11px;text-align:center;background:var(--ph);opacity:0;transition:opacity .4s;}
  .pc .fr:nth-child(1){background:#e9e3d9;}.pc .fr:nth-child(2){background:#dfe4e3;}.pc .fr:nth-child(3){background:#e9e0e2;}.pc .fr:nth-child(4){background:#e2e7df;}
  .pc .fr.show{opacity:1;}
  .pc .bars{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:4px;}
  .pc .bars i{flex:1;height:3px;border-radius:2px;background:rgba(21,20,15,.18);}
  .pc .bars i.on{background:var(--ink);}
  .pc .badge{position:absolute;top:20px;left:12px;z-index:3;background:rgba(21,20,15,.5);color:#fff;font-size:9.5px;letter-spacing:0.04em;padding:4px 9px;border-radius:20px;}
  .pc .navz{position:absolute;top:20px;bottom:66px;width:42%;z-index:2;cursor:pointer;}
  .pc .navz.l{left:0;} .pc .navz.r{right:0;}
  .pc .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:36px 14px 14px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5));color:#fff;transition:opacity .15s;}
  .pc .meta b{display:block;font-size:12.5px;font-weight:600;}
  .pc .meta span{font-size:11.5px;opacity:.92;}
  .pc .qs{position:absolute;left:0;right:0;bottom:0;z-index:4;background:rgba(255,255,255,.98);border-top:1px solid var(--ink);padding:12px;transform:translateY(110%);transition:transform .2s cubic-bezier(.2,.7,.2,1);}
  .pc:hover .qs,.pc.show .qs{transform:translateY(0);}
  .pc:hover .meta,.pc.show .meta{opacity:0;}
  .pc .qs .hlabel{font-size:9.5px;color:var(--pht);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
  .pc .qs .opt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
  .pc .qs .opt span{min-width:26px;text-align:center;border:1px solid #d8d4cc;padding:5px 0;font-size:10.5px;color:var(--mut);border-radius:8px;}
  .pc .qs .btns{display:flex;gap:6px;}
  .pc .qs .btns div{flex:1;text-align:center;font-size:11px;padding:9px 0;border:1px solid var(--ink);color:var(--ink);border-radius:10px;}
  .pc .qs .btns .p{background:var(--ink);color:#fff;}
  .extlink{background:var(--cream);border-radius:18px;padding:60px 24px;text-align:center;}
  .extlink .tt{font-size:17px;font-weight:700;letter-spacing:-0.02em;}
  .extlink .dd{margin:10px 0 20px;color:var(--mut);font-size:12.5px;line-height:1.7;}
  .extlink .bt{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;font-size:12px;border-radius:10px;}
  .extlink .ur{margin-top:14px;color:var(--pht);font-size:11.5px;}
  @media(max-width:760px){
    main{padding:0 18px 80px;}
    .g3,.g4,.g5{grid-template-columns:repeat(2,1fr);}
    .pcwrap{grid-template-columns:repeat(2,1fr);}
    .hs>.card{flex-basis:calc((100% - 14px)/2);}
    .hero .cap{font-size:16px;}
  }
</style>
</head>
<body>
<nav class="tabs" id="tabs"><span class="brand">MINDBRIDGE</span></nav>
<main id="app"></main>

<script>
/* ─── v5 원칙: 템플릿 4종 + 공통 모듈 5종(M1~M5)만 사용. 신규 컴포넌트 없음 ───
   M1 VISUAL   풀블리드 비주얼·배너 통합(이미지/영상+카피, 크기·링크는 옵션)
   M2 CARD     카드 1종 — variant 2개: 상품형(가격) / 콘텐츠형(라벨)
   M3 CHIPS    칩 내비(카테고리·프리셋·앵커)
   M4 LIST     상품 리스트(퍼싯 필터+정렬+페이지네이션) — 1종, 남/녀 2적용
   M5 CURATION 착용컷 스토리형 큐레이션 — 유일 커스텀, 홈 1곳만
   TXT         공통 텍스트 스타일(스테이트먼트+리드) — 모듈 아님, 타이포 스타일 */

const TABS = ["HOME","MEN","WOMEN","WORKDAY","BRAND","OUTLET"];
const LABEL = {HOME:"홈",MEN:"남성",WOMEN:"여성",WORKDAY:"TODAY'S EDIT",BRAND:"저널",OUTLET:"아울렛",STORE:"매장찾기",SCOPE:"산출 범위",LANDING:"랜딩 샘플"};

const ph = (h,label="") => `<div class="ph" style="height:${h}px">${label}</div>`;
const ICO_IMG = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L4 20"></path></svg>';
const ICO_VID = '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
function imlTag(t){var v=/영상|비디오|video|루프|모션/i.test(t);var i=/이미지|썸네일|룩북|키비주얼|배너|캠페인|매거진|컷|비주얼|사진|화보/i.test(t);var ic="";if(i||!v)ic+='<span class="ico">'+ICO_IMG+'</span>';if(v)ic+='<span class="ico">'+ICO_VID+'</span>';return '<span class="iml">'+ic+'<span>'+t+'</span></span>';}
const hero = (h,cap,kick="",typ="이미지") => `<div class="ph hero" style="height:${h}px">${imlTag(typ)}${kick?`<span class="kick">${kick}</span>`:""}<span class="cap">${cap}</span></div>`;
const cards = (cols,items,h,imgl="")=>`<div class="g g${cols}">${items.map(([a,b])=>`<div class="card"><div class="im" style="height:${h}px">${imgl?imlTag(imgl):""}</div><div class="c"><b>${a}</b>${b||""}</div></div>`).join("")}</div>`;
const swipe = (items,h,n,imgl="")=>`<div class="hs" style="--n:${n}">${items.map(([a,b])=>`<div class="card"><div class="im" style="height:${h}px">${imgl?imlTag(imgl):""}</div><div class="c"><b>${a}</b>${b||""}</div></div>`).join("")}</div>`;
const chips = (items,act=-1)=>`<div class="chips">${items.map((t,i)=>`<span class="chip${i===act?' a':''}">${t}</span>`).join("")}</div>`;
const stmt = t=>`<div class="stmt">${t}</div>`;
const tile = (t,h)=>`<div class="tile" style="height:${h}px">${t.split("\n").map((ln,i)=>i?`<small>${imlTag(ln)}</small>`:ln).join("")}</div>`;
const split = (l,r,h)=>`<div class="g g2">${tile(l,h)}${tile(r,h)}</div>`;
function sec(i,t,mod,inner){return `<section class="anim"><div class="sl"><span class="i">${i}</span><span class="t">${t}</span>${mod?`<span class="n">${mod}</span>`:""}</div>${inner}</section>`;}
const extlink = (tt,dd,bt,ur)=>`<div class="extlink"><div class="tt">${tt}</div><div class="dd">${dd}</div><div class="bt">${bt}</div><div class="ur">${ur}</div></div>`;
const grid = (cols,items,h,cap="")=>`<div class="g g${cols}">${items.map(t=>`<div class="tile sm" style="height:${h}px">${t}${cap?`<small>${imlTag(cap)}</small>`:""}</div>`).join("")}</div>`;
function navChips(items){return `<div class="chips">`+items.map(([l,a])=>`<span class="chip" onclick="${a}">${l}</span>`).join("")+`</div>`;}
function catChips(cats){return `<div class="chips">`+cats.map((c,i)=>`<span class="chip${i===0?' a':''}" onclick="goCat('${c}')">${c}</span>`).join("")+`</div>`;}
function goSectionLike(k){const ss=[...document.querySelectorAll("#app section")];const t=ss.find(s=>{const e=s.querySelector(".t");return e&&e.textContent.indexOf(k)>-1;});if(t)t.scrollIntoView({behavior:"smooth",block:"start"});}
function goCat(cat){const ss=[...document.querySelectorAll("#app section")];const t=ss.find(s=>{const e=s.querySelector(".t");return e&&/상품( 리스트)?$/.test(e.textContent.trim());});if(!t)return;t.scrollIntoView({behavior:"smooth",block:"start"});t.querySelectorAll('.fdp [data-grp="cat"]').forEach(c=>c.classList.toggle("a",c.dataset.cat===cat));const fd0=t.querySelector(".fdrop .fd");if(fd0){fd0.closest(".fdrop").querySelectorAll(".fd").forEach(x=>x.classList.remove("open"));}refreshChips(t);}

/* M4 LIST 필터 */
function fdItems(arr,multi,grp,act){return arr.map((x,i)=>`<span class="tgl${multi?'':' sortt'}${act&&i===0?' a':''}" ${multi?`data-cat="${x}" data-grp="${grp}"`:''} onclick="${multi?'setTgl(this)':'setSort(this)'}">${x}</span>`).join("");}
function fd(label,inner){return `<div class="fd"><button class="fdh" onclick="fdToggle(this)">${label} <span class="ar">▾</span></button><div class="fdp">${inner}</div></div>`;}
function setTgl(el){const bar=el.closest(".fdp");if(!bar)return;const all=bar.querySelector('[data-cat="전체"]');if(el.dataset.cat==="전체"){bar.querySelectorAll(".tgl").forEach(b=>b.classList.toggle("a",b===el));}else{el.classList.toggle("a");if(all)all.classList.remove("a");const anyOn=[...bar.querySelectorAll(".tgl")].some(b=>b.dataset.cat!=="전체"&&b.classList.contains("a"));if(!anyOn&&all)all.classList.add("a");}const s=el.closest("section");if(s)refreshChips(s);}
function setSort(el){const row=el.closest(".fdp");if(row)row.querySelectorAll(".tgl").forEach(b=>b.classList.toggle("a",b===el));const fdh=el.closest(".fd").querySelector(".fdh");if(fdh)fdh.innerHTML='정렬: '+el.textContent.trim()+' <span class="ar">▾</span>';}
function fdToggle(btn){const f=btn.parentElement;const open=f.classList.contains("open");f.closest(".fdrop").querySelectorAll(".fd").forEach(x=>x.classList.remove("open"));if(!open)f.classList.add("open");}
function refreshChips(sec){const wrap=sec.querySelector(".achips");if(!wrap)return;const act=[...sec.querySelectorAll(".fdp .tgl.a")].filter(b=>!b.classList.contains("sortt")&&b.dataset.cat!=="전체");wrap.innerHTML=act.length?act.map(b=>`<span class="achip" data-cat="${b.dataset.cat}" data-grp="${b.dataset.grp||""}">${b.textContent.trim()}<i onclick="removeChip(this)">✕</i></span>`).join(""):`<span class="none">적용된 필터 없음</span>`;const cnt=sec.querySelector(".cnt");if(cnt)cnt.textContent="총 "+(act.length?Math.max(8,120-act.length*17):120)+"개";}
function removeChip(i){const chip=i.parentElement,sec=chip.closest("section"),cat=chip.dataset.cat,grp=chip.dataset.grp;const sel=`.fdp .tgl[data-cat="${cat}"]`+(grp?`[data-grp="${grp}"]`:"");const t=sec.querySelector(sel);if(t){t.classList.remove("a");const p=t.closest(".fdp"),all=p.querySelector('[data-cat="전체"]');if(all){const anyOn=[...p.querySelectorAll(".tgl")].some(b=>b.dataset.cat!=="전체"&&b.classList.contains("a"));if(!anyOn)all.classList.add("a");}}refreshChips(sec);}
function clearFilters(node){const sec=node.closest("section");sec.querySelectorAll(".fdp .tgl").forEach(b=>{if(!b.classList.contains("sortt"))b.classList.remove("a");});sec.querySelectorAll(".fdp").forEach(p=>{const all=p.querySelector('[data-cat="전체"]');if(all)all.classList.add("a");});refreshChips(sec);}
function initFilters(){document.querySelectorAll("#app section").forEach(sc=>{if(sc.querySelector(".achips"))refreshChips(sc);});}

const devBtn=document.createElement("button");devBtn.className="util dev";devBtn.title="클릭하면 각 영역 개발 설명 표시";devBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:-2px;margin-right:5px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.9" fill="currentColor"></circle></svg>설명보기';devBtn.onclick=()=>{document.body.classList.toggle("showdev");devBtn.classList.toggle("on");};tabsEl.appendChild(devBtn);

const app=document.getElementById("app");
function applyDevNotes(k){const a=ANN[k];if(!a)return;app.querySelectorAll("section").forEach((sx,i)=>{if(!a[i])return;const sl=sx.querySelector(".sl");const html='<div class="devnote"><span class="dtag">DEV</span>'+a[i]+'</div>';if(sl)sl.insertAdjacentHTML("afterend",html);else sx.insertAdjacentHTML("afterbegin",html);});}
function show(k){
  const d=P[k];
  app.innerHTML =
    `<div class="head"><h1>${LABEL[k]||k}</h1><span class="url">mindbridge.tbhshop.co.kr — ${d.url}</span></div>`+
    `<div class="lede">${d.lede}</div>`+
    (k==="SCOPE"?"":gnb(k))+ d.body;
  initPC();
  initFilters();
  applyDevNotes(k);
  [...tabsEl.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  window.scrollTo({top:0,behavior:"smooth"});
}
/* M5 CURATION 인터랙션 */
function initPC(){
  document.querySelectorAll(".pc").forEach(pc=>{
    const frs=[...pc.querySelectorAll(".fr")], bars=[...pc.querySelectorAll(".bars i")];
    if(!frs.length) return;
    let idx=0,t=null;
    const set=n=>{idx=(n+frs.length)%frs.length;frs.forEach((f,i)=>f.classList.toggle("show",i===idx));bars.forEach((b,i)=>b.classList.toggle("on",i<=idx));};
    pc.addEventListener("mouseenter",()=>{clearInterval(t);t=setInterval(()=>set(idx+1),1100);});
    pc.addEventListener("mouseleave",()=>{clearInterval(t);set(0);});
    const l=pc.querySelector(".navz.l"),r=pc.querySelector(".navz.r");
    if(l)l.onclick=e=>{e.stopPropagation();set(idx-1);};
    if(r)r.onclick=e=>{e.stopPropagation();set(idx+1);};
    set(0);
  });
  const demo=document.querySelector(".pc.show");
  if(demo){const f=[...demo.querySelectorAll(".fr")],bb=[...demo.querySelectorAll(".bars i")];if(f[1]){f.forEach((x,i)=>x.classList.toggle("show",i===1));bb.forEach((x,i)=>x.classList.toggle("on",i<=1));}}
}
show("HOME");
