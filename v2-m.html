<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIND BRIDGE — B안 모바일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
html,body{margin:0;padding:0;height:100%;background:#fafafa;font-family:Pretendard,-apple-system,sans-serif;color:#000;letter-spacing:0}
*{box-sizing:border-box}
a{text-decoration:none}
.bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:.5px solid #e5e5e5;z-index:10}
.bar .t{font-size:13px;font-weight:700;color:#000}
.bar .s{font-size:11px;color:#8a8a8a;margin-left:12px}
.nav{display:flex;gap:20px;font-size:11px;font-weight:700}
.nav a{color:#8a8a8a}
.nav a:hover{color:#000}
.nav .on{color:#000}
.stage{height:100%;padding:52px 0 0 60px;display:flex;align-items:center;justify-content:flex-start;overflow:hidden}
.sc{transform-origin:left center}
.ph{width:393px;height:852px;background:#fff;border:0.5px solid #b4b2a9;border-radius:22px;padding:0;overflow:hidden}
.scr{position:relative;width:100%;height:100%;background:#fff;border-radius:22px;overflow:hidden}
.scr iframe{width:calc(100% + 22px);height:100%;border:0;display:block}
</style>
</head>
<body>
<div class="bar">
  <span><span class="t">B안</span><span class="s">카드 그리드 · 393px</span></span>
  <span class="nav"><a href="./v2.html">PC</a><span class="on">MOBILE</span><a href="./index.html">목록</a></span>
</div>
<div class="stage"><div class="sc" id="sc">
  <div class="ph"><div class="scr">
        <iframe src="./v2.html" title="B안 모바일 미리보기"></iframe>
      </div></div>
</div></div>
<script>
(function(){
  var fr=document.querySelector("iframe");
  function hidenav(){
    try{
      var d=fr.contentDocument; if(!d||!d.head) return;
      if(d.getElementById("__nofloat")) return;
      var st=d.createElement("style"); st.id="__nofloat";
      st.textContent="#__dcnav{display:none!important}";
      d.head.appendChild(st);
    }catch(e){}
  }
  fr.addEventListener("load",function(){hidenav();setTimeout(hidenav,600);setTimeout(hidenav,2000);});
  hidenav(); setTimeout(hidenav,1200); setTimeout(hidenav,3000);
})();
(function(){var e=document.getElementById("sc");function f(){var s=Math.min((window.innerHeight-52-48)/860,(window.innerWidth-120)/400,1);e.style.transform="scale("+s+")"}f();window.addEventListener("resize",f)})();
</script>
</body>
</html>
